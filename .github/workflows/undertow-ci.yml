name: Undertow CI

on:
  push:
    branches: [main]
    paths:
      - "server/undertow/**"
      - ".github/workflows/undertow-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/undertow/**"
      - ".github/workflows/undertow-ci.yml"
  workflow_dispatch:

concurrency:
  group: undertow-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server/undertow

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool restore
      - run: dotnet format Undertow.slnx --verify-no-changes
      - run: dotnet fantomas --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Undertow.slnx -warnaserror
      - run: dotnet test Undertow.slnx --no-build
      - name: Vulnerable package scan
        run: |
          dotnet list Undertow.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tylerbutler/floodgate
          path: floodgate
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: floodgate/client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: floodgate/client
      - uses: extractions/setup-just@v2
      # The dual-mode gate: 38 Routerlicious + 7 Phoenix/cross-mode against
      # one Undertow process. The suites fail loudly on any count regression,
      # so the recorded baseline (38 + 7) gates the merge.
      - run: just test-undertow-dual-mode
        env:
          FLOODGATE_REPO: floodgate
