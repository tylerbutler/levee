name = "levee_server"
version = "0.1.0"
target = "erlang"
description = "Gleam HTTP server (strangler front door) for Levee"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_erlang = ">= 0.34.0 and < 2.0.0"
gleam_otp = ">= 0.14.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_crypto = ">= 1.3.0 and < 2.0.0"
mist = ">= 6.0.0 and < 8.0.0"
wisp = ">= 1.0.0 and < 3.0.0"
envoy = ">= 1.1.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
beryl = { git = "https://github.com/tylerbutler/beryl.git", ref = "9ee235a444052e1516e4a4b74db67c4fe9a3e9e3" }
vestibule = { git = "https://github.com/tylerbutler/vestibule.git", ref = "99755424808a59f72dee51e5bc3297b9d0abb547" }

# Path dependencies to sibling Gleam packages
levee_protocol = { path = "../levee_protocol" }
levee_auth = { path = "../levee_auth" }
levee_storage = { path = "../levee_storage" }
levee_oauth = { path = "../levee_oauth" }
levee_documents = { path = "../levee_documents" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
phoenix_channel_fixtures = { git = "https://github.com/tylerbutler/phoenix_channel_fixtures.git", ref = "7daccb856d17db6278980277237c201b2acdcdf1" }
