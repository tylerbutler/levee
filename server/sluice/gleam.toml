name = "sluice"
version = "0.1.0"
description = "Fluid Framework server on beryl: dewdrop/server codec + spillway protocol logic"
licences = ["MIT"]
target = "erlang"
gleam = ">= 1.13.0"

[dependencies]
gleam_stdlib = ">= 0.62.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_erlang = ">= 0.29.0 and < 2.0.0"
gleam_otp = ">= 0.12.0 and < 2.0.0"
gleam_crypto = ">= 1.0.0 and < 2.0.0"
beryl = { path = "../../../beryl" }
dewdrop = { path = "../../../dewdrop" }
spillway = { path = "../../../spillway" }
mist = ">= 6.0.0 and < 7.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
